name: Deploy static documentation and browser laboratory

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "lang/**"
      - "tools/pushkalavati-compiler/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust toolchain for generated-code regression tests
        uses: dtolnay/rust-toolchain@stable
      - name: Validate static site
        run: |
          bash scripts/test_all.sh
          node --check docs/app.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload docs directory as site root
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
